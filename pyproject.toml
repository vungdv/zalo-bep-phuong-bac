[project]
name = "order-extractor"
version = "0.1.0"
description = "Read orders from Zalo Web chats and append them to Google Sheets"
readme = "specs/requirements.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "gspread>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
order-extractor = "order_extractor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/order_extractor"]
# Non-Python files inside the package (db/migrations/*.sql, zalo/reader.js) ship with the wheel.
artifacts = ["src/order_extractor/**/*.sql", "src/order_extractor/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=order_extractor --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["order_extractor"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
